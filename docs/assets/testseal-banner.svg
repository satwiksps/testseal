<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">TestSeal</title>
  <desc id="description">A terminal diff in which TestSeal flags an equality assertion changed to a truthiness assertion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset="1" stop-color="#17102c"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050816" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="52" r="210" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="78" cy="455" r="170" fill="#2dd4bf" opacity="0.06"/>

  <g transform="translate(72 91)">
    <path d="M62 2 116 23v43c0 43-23 74-54 92C31 140 8 109 8 66V23Z" fill="url(#seal)"/>
    <path d="M62 23 95 36v30c0 27-13 48-33 62-20-14-33-35-33-62V36Z" fill="#12172c"/>
    <path d="m45 69 12 12 25-29" fill="none" stroke="#ecfeff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="300" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750" letter-spacing="-2">TestSeal</text>
  <text x="74" y="344" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">TEST INTEGRITY FOR THE AGENT ERA</text>
  <text x="74" y="389" fill="#aab4ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">Deterministic. Diff-aware. Advisory by default.</text>

  <g transform="translate(535 64)" filter="url(#shadow)">
    <rect width="593" height="351" rx="16" fill="#0a0f1e" stroke="#2b3550" stroke-width="2"/>
    <path d="M0 16A16 16 0 0 1 16 0h561a16 16 0 0 1 16 16v31H0Z" fill="#151d31"/>
    <circle cx="24" cy="24" r="6" fill="#fb7185"/>
    <circle cx="45" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="66" cy="24" r="6" fill="#34d399"/>
    <text x="297" y="30" fill="#8491aa" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">tests/test_checkout.py</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
      <text x="29" y="91" fill="#93a4bf">@@ test_discount_total @@</text>
      <rect x="18" y="111" width="557" height="36" rx="6" fill="#3f1d2b" opacity="0.75"/>
      <text x="29" y="136" fill="#fda4af">- assert total == Decimal(&quot;19.99&quot;)</text>
      <rect x="18" y="153" width="557" height="36" rx="6" fill="#123c34" opacity="0.82"/>
      <text x="29" y="178" fill="#6ee7b7">+ assert total</text>
      <text x="29" y="232" fill="#a78bfa">$ testseal scan --base origin/main</text>
      <rect x="18" y="254" width="557" height="70" rx="8" fill="#17152d" stroke="#4c3b77"/>
      <text x="31" y="281" fill="#fca5a5" font-weight="700">HIGH  TS003  Assertion weakened</text>
      <text x="31" y="307" fill="#cbd5e1" font-size="15">Strict equality became a truthiness check.</text>
    </g>
  </g>
</svg>
