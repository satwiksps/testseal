name: Release

on:
  push:
    tags:
      # Ref filters are globs; scripts/check_release_version.py performs the
      # authoritative vMAJOR.MINOR.PATCH validation.
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_release_version.py
      - name: Verify the release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-python:
    name: Build Python distributions
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Check Python lint and formatting
        run: |
          python -m ruff check packages/testseal/src packages/testseal/tests scripts
          python -m ruff format --check packages/testseal/src packages/testseal/tests scripts
      - name: Run release-candidate tests
        run: >-
          python -m pytest packages/testseal/tests
          --cov=testseal
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Build
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test the built wheel
        run: python scripts/verify_example.py
      - name: Verify the self-installing pre-commit hook
        run: |
          python -m pre_commit validate-manifest
          python -m pre_commit try-repo . testseal --all-files --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-action:
    name: Verify bundled Action
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/action/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run verify
      - name: Confirm the executable bundle is committed
        run: >-
          git ls-files --error-unmatch
          dist/index.js
          dist/licenses.txt
      - name: Confirm the release tag contains the generated bundle
        run: git diff --exit-code -- dist

  verify-site:
    name: Verify website
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify

  verify-action-integration:
    name: Verify consumer Action install
    needs: [verify-version, verify-action]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install bundled source and scan the release change
        uses: ./
        with:
          base: HEAD^
          head: HEAD
          fail-on: never

  publish-pypi:
    name: Publish Python package to PyPI
    needs: [build-python, verify-action, verify-action-integration, verify-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/testseal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Verify the package is available from PyPI
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if python -m pip download --no-deps --only-binary=:all: \
              --dest "${RUNNER_TEMP}/pypi-check" "testseal==${release_version}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  github-release:
    name: Create GitHub release
    needs: [build-python, verify-action, verify-action-integration, verify-site, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create release with generated notes
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
