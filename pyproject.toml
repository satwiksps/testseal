[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "testseal"
version = "1.0.0"
description = "Deterministic test-suite integrity checks for Python and pytest diffs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TestSeal contributors" }]
keywords = [
  "pytest",
  "unittest",
  "testing",
  "test-integrity",
  "ai-agents",
  "static-analysis",
  "code-review",
  "ci",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://testseal-integrity.vercel.app"
Repository = "https://github.com/satwiksps/testseal.git"
Issues = "https://github.com/satwiksps/testseal/issues"
Changelog = "https://github.com/satwiksps/testseal/blob/main/CHANGELOG.md"
Documentation = "https://testseal.readthedocs.io/"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.11,<1",
  "twine>=6.0",
]

[project.scripts]
testseal = "testseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/testseal/src/testseal"]

[tool.hatch.build.targets.sdist]
include = [
  "packages/testseal/src/testseal",
  "packages/testseal/tests",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]
exclude = [
  "/.gitignore",
  "/packages/action",
  "/site",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["packages/testseal/tests"]
pythonpath = ["packages/testseal/src"]

[tool.coverage.run]
branch = true
source = ["testseal"]

[tool.coverage.report]
show_missing = true
skip_covered = true
